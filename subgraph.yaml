specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PurseToken404
    network: bsc
    source:
      address: "0x29a63F4B209C29B4DC47f06FFA896F32667DAD2C"
      abi: PurseToken404
      startBlock: 11732360
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Burn
        - Liquidity
      abis:
        - name: PurseToken404
          file: ./abis/PurseToken404.json
      eventHandlers:
        - event: Burn(indexed address,uint256)
          handler: handleBurn
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/purse-token-404.ts
  - kind: ethereum
    name: PurseFarm
    network: bsc
    source:
      address: "0x439ec8159740a9B9a579F286963Ac1C050aF31C8"
      abi: PurseFarm
      startBlock: 13250931
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FarmTVLUpdate
      abis:
        - name: PurseFarm
          file: ./abis/PurseFarm.json
        - name: LpErc20
          file: ./abis/LpErc20.json
      eventHandlers:
        - event: AddNewPool(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleAddPool
      file: ./src/purse-farm.ts
templates:
  - kind: ethereum
    name: Pool
    network: bsc
    source:
      abi: FarmPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FarmPool
      abis:
        - name: PurseStaking
          file: ./abis/PurseStaking.json
        - name: FarmPool
          file: ./abis/FarmPool.json
        - name: LpErc20
          file: ./abis/LpErc20.json
        - name: PurseFarm
          file: ./abis/PurseFarm.json
      eventHandlers:
        - event: Sync(uint112,uint112)
          handler: handleSync
      file: ./src/purse-farm-pool.ts
